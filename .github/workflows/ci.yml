# ──────────────────────────────────────────────────────────────
# Ashish Sudh Jal — Continuous Integration (Triple-Verification Gate)
#
# Enforces Invariant 3 from AGENTS.md on every push and pull request:
#   1. npm run lint   → 0 errors, 0 warnings
#   2. npm test       → 100% passing (zero skipped)
#   3. npm run build  → Clean Next.js production build
# ──────────────────────────────────────────────────────────────

name: CI — Triple-Verification Gate

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# Cancel superseded runs on the same branch/PR to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint → Test → Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # ── Checkout ──────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Node.js Setup ────────────────────────────────────
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # ── Install Dependencies ─────────────────────────────
      - name: Install dependencies
        run: npm ci

      # ── Gate 1: Lint (0 errors, 0 warnings) ─────────────
      - name: Lint (ESLint strict — src/ & tests/)
        run: npm run lint

      # ── Gate 2: Test (100% passing, zero skipped) ────────
      - name: Test (Vitest in-memory unit tests)
        run: npm test

      # ── Gate 3: Build (Clean Next.js production build) ───
      - name: Build (Next.js production compilation)
        run: npm run build
